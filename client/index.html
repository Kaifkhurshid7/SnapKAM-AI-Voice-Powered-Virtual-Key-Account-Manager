<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b10" />
    <meta
      name="description"
      content="SnapKAM is a voice-first AI Virtual Key Account Manager that helps marketplace sellers understand a sales decline and act on it."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SnapKAM | Voice-first Virtual Key Account Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Dark is the default.
      (function () {
        var dark = true;
        try {
          dark = localStorage.getItem('snapkam-theme') !== 'light';
        } catch (e) {
          /* storage unavailable: keep the dark default */
        }
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
